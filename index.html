<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanishq Catalogue Hub</title>
  <style>
    :root {
      --bg: #090e1a;
      --card-bg: #131c2e;
      --border: #22324e;
      --primary: #38bdf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; margin: 0; }
    .hub-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; max-width: 520px; width: 100%; padding: 32px 24px; text-align: center; box-shadow: 0 20px 45px rgba(0,0,0,0.6); }
    h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 1.6rem; }
    p { color: var(--text-muted); font-size: 0.85rem; margin: 0 0 24px 0; }
    .nav-list { display: flex; flex-direction: column; gap: 12px; }
    .nav-btn { display: flex; flex-direction: column; align-items: flex-start; text-decoration: none; background: #0b1324; border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; transition: all 0.2s ease; }
    .nav-btn:hover { border-color: var(--primary); transform: translateY(-2px); background: #111c35; }
    .nav-title { font-weight: 700; color: #fff; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
    .nav-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="hub-card">
    <h1>Tanishq Catalogue Hub</h1>
    <p>Select your preferred inspection tool</p>
    <div class="nav-list">
      <a href="./tanishq_catalogue_automatic/" class="nav-btn">
        <span class="nav-title">🔒 Automatic Secured Catalogue</span>
        <span class="nav-desc">Encrypted preloaded dataset with store PIN authentication.</span>
      </a>
      <a href="./tanishq_catalogue_manual/" class="nav-btn">
        <span class="nav-title">📁 Manual File Inspector</span>
        <span class="nav-desc">Upload raw Suggestion report.xlsx manually directly in-browser.</span>
      </a>
    </div>
  </div>
</body>
</html>
